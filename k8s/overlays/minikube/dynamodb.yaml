apiVersion: v1
kind: Service
metadata:
  name: execucao-dynamodb
  labels:
    app.kubernetes.io/name: execucao-dynamodb
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  selector:
    app.kubernetes.io/name: execucao-dynamodb
  ports:
    - name: dynamodb
      port: 8000
      targetPort: dynamodb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execucao-dynamodb
  labels:
    app.kubernetes.io/name: execucao-dynamodb
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: execucao-dynamodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execucao-dynamodb
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      containers:
        - name: dynamodb
          image: amazon/dynamodb-local
          args:
            - -jar
            - DynamoDBLocal.jar
            - -sharedDb
            - -inMemory
          ports:
            - name: dynamodb
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: dynamodb
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
