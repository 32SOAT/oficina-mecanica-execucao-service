apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oficina-mecanica
resources:
  - namespace.yaml
  - dynamodb.yaml
  - execucao-service.yaml
configMapGenerator:
  - name: execucao-service-config
    literals:
      - NODE_ENV=production
      - APP_PORT=3000
      - SERVICE_NAME=execucao-service
      - DYNAMODB_ENDPOINT=http://execucao-dynamodb:8000
      - DYNAMODB_REGION=us-east-1
      - DYNAMODB_TABLE=execucao
secretGenerator:
  - name: execucao-service-secret
    literals:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - SAGA_TOKEN=oficina-local
generatorOptions:
  labels:
    app.kubernetes.io/part-of: oficina-mecanica
