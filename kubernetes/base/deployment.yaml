apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-execution
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-execution
  template:
    metadata:
      labels:
        app: oficina-execution
        tags.datadoghq.com/service: oficina-execution
    spec:
      serviceAccountName: oficina-execution
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: oficina-execution
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_SERVICE
              value: oficina-execution
            - name: DD_LOGS_INJECTION
              value: "true"
          envFrom:
            - configMapRef:
                name: oficina-execution-config
            - secretRef:
                name: oficina-execution-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
